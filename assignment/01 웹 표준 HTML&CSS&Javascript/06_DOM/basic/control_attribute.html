<!DOCTYPE html>
<html>

<head>
  <title>control_attribute</title>
  <script>
    window.onload = function () {
      const $img = document.querySelector('img');
      $img.src = 'http://via.placeholder.com/300x200';
      $img.width = 300;
      $img.height = 200;
    };
  </script>
</head>

<body>
  <img id="image" />
</body>

</html>
