<!DOCTYPE html>
<html>

<head>
  <title>select_query</title>
  <script>
    window.onload = function () {
      const $h1 = document.querySelector('h1');
      $h1.style.cssText = 'background-color: red; color: orange';
      $h1.textContent = 'From JavaScript';
    };
  </script>
</head>

<body>
  <h1>Header</h1>
  <h1>Header</h1>
  <h1>Header</h1>
</body>

</html>
