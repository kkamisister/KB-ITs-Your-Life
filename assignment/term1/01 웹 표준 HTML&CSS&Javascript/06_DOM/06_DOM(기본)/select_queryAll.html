<!DOCTYPE html>
<html>

<head>
  <title>select_queryAll</title>
  <script>
    window.onload = function () {
      const $h1s = document.querySelectorAll('h1');
      for (let i = 0; i < $h1s.length; i++) {
        $h1s[i].style.cssText = 'background-color: red; color: orange';
        $h1s[i].textContent = 'From JavaScript';
      }
    };
  </script>
</head>

<body>
  <h1>Header</h1>
  <h1>Header</h1>
  <h1>Header</h1>
</body>

</html>
