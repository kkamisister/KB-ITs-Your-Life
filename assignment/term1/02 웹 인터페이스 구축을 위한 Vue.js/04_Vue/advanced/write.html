<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>write</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="card shadow">
        <div class="card-body">
            <h4 class="card-title mb-4">
                <i class="fas fa-pen-to-square"></i> 새 글쓰기
            </h4>

            <form>
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" class="form-control" id="title" placeholder="제목을 입력하세요">
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label">작성자</label>
                    <input type="text" class="form-control" id="author" placeholder="작성자 이름을 입력하세요">
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">내용</label>
                    <textarea class="form-control" id="content" rows="6" placeholder="내용을 입력하세요"></textarea>
                </div>

                <div class="d-flex justify-content-start">
                    <button type="submit" class="btn btn-primary me-2">
                        <i class="fas fa-check"></i> 확인
                    </button>
                    <button type="reset" class="btn btn-primary me-2">
                        <i class="fas fa-xmark"></i> 취소
                    </button>
                    <a href="list.html" class="btn btn-primary me-2">
                        <i class="fas fa-list"></i> 목록
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
